<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi</title>
  <style>
    :root {
      --size: min(92vw, 86vh);   /* 사진 크기 */
      --radius: 28px;
    }
    html {
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar { display: none; }
    body {
      margin: 0;
      background: #0b0b10;
    }

    /* 배경: 현재 사진을 흐리게 깔아서 분위기 연출 */
    .bgs {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: -10%;
      background-size: cover;
      background-position: center;
      filter: blur(60px) saturate(1.4) brightness(0.55);
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    .bg.active { opacity: 1; }

    /* 사진 1장 = 스크롤 1칸. 스크롤 위치를 잡아 주는 역할이고,
       WebGL을 못 쓰는 환경에서는 이 사진이 그대로 보인다. */
    .page {
      position: relative;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .page img,
    .frame {
      width: var(--size);
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .page img {
      object-fit: cover;
      display: block;
    }

    /* 그림이 그려지는 종이. 가루가 종이 밖으로 날아갈 수 있게 캔버스는 화면 전체를 덮는다 */
    .frame {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #f6f2e9;
      display: none;
    }
    #paper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: none;
    }
    .gl .frame, .gl #paper { display: block; }
    .gl .page img { visibility: hidden; }
    #paper.fade { animation: fade 0.5s ease; }
    @keyframes fade { from { opacity: 0; } }

    .dots {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: background 0.3s, transform 0.3s;
    }
    .dots span.active {
      background: #fff;
      transform: scale(1.5);
    }
  </style>
</head>
<body>
  <div class="bgs"></div>
  <section class="page"><img src="see.jpeg" alt="사진 1"></section>
  <section class="page"><img src="mad.jpeg" alt="사진 2"></section>
  <section class="page"><img src="cry.jpeg" alt="사진 3"></section>
  <section class="page"><img src="fu.jpeg" alt="사진 4"></section>

  <div class="frame"></div>
  <canvas id="paper" aria-hidden="true"></canvas>
  <div class="dots" aria-hidden="true"></div>

  <script>
  (() => {
    const pages = [...document.querySelectorAll('.page')];
    const imgs = pages.map(p => p.querySelector('img'));
    const canvas = document.getElementById('paper');
    const frameEl = document.querySelector('.frame');
    const bgBox = document.querySelector('.bgs');
    const dotsBox = document.querySelector('.dots');
    const bgs = imgs.map(img => {
      const el = document.createElement('div');
      el.className = 'bg';
      el.style.backgroundImage = `url(${img.getAttribute('src')})`;
      return bgBox.appendChild(el);
    });
    const setBg = i => bgs.forEach((bg, k) => bg.classList.toggle('active', k === i));
    // 처음부터 빈 종이로 시작한다 (사진이 먼저 번쩍 보였다가 다시 그려지지 않도록)
    let glOn = true;
    document.body.classList.add('gl');
    // 효과를 못 쓰게 됐을 때: 사진만 스크롤로 넘겨 보는 기본 화면으로 둔다
    function giveUp(reason) {
      console.warn('그리기 효과를 끕니다:', reason);
      glOn = false;
      document.body.classList.remove('gl');
      setBg(target);
    }
    const dots = pages.map(() => dotsBox.appendChild(document.createElement('span')));
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const ERASE_MS = 1700;  // 채색 날리기 → 스케치 날리기
    const DRAW_MS = 2800;   // 스케치 → 채색
    const CELL = 5;         // 날아가는 가루 한 알의 크기 (CSS px)

    const clamp01 = v => Math.min(Math.max(v, 0), 1);
    const easeInOut = t => t * t * (3 - 2 * t);

    // ---------- 스크롤 → 목표 사진 ----------
    let target = 0;
    function readScroll() {
      const h = pages[0].offsetHeight || innerHeight;
      target = Math.min(Math.max(Math.round(scrollY / h), 0), pages.length - 1);
      dots.forEach((dot, i) => dot.classList.toggle('active', i === target));
      if (!glOn) setBg(target);
    }
    addEventListener('scroll', readScroll, { passive: true });
    readScroll();

    // ---------- WebGL ----------
    const gl = canvas.getContext('webgl', { alpha: true, antialias: false, premultipliedAlpha: true });
    if (!gl || gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS) < 2) {
      giveUp('WebGL을 쓸 수 없음');
      return;
    }

    // 정점/프래그먼트 셰이더가 함께 쓰는 부분: 그리는 순서·지워지는 순서를 정하는 마스크
    const COMMON = `
      precision highp float;
      uniform vec2 uRes;      // 종이 크기 (CSS px)
      uniform vec2 uCenter;   // 종이 중심 (클립 좌표)
      uniform vec2 uHalf;     // 종이 절반 크기 (클립 좌표)
      uniform vec2 uCover;    // 사진을 종이에 꽉 채우기 위한 배율
      uniform float uDrawS;   // 스케치 진행도 0→1
      uniform float uDrawC;   // 채색 진행도 0→1
      uniform float uEraseC;  // 채색 날리기 진행도 0→1
      uniform float uEraseS;  // 스케치 날리기 진행도 0→1
      uniform float uSeed;
      uniform sampler2D uColorTex;
      uniform sampler2D uSketchTex;

      const float LIFE = 0.5;                    // 가루가 날아가는 시간 비율
      const vec3 PENCIL = vec3(0.22, 0.22, 0.25);

      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      float fbm(vec2 p) {
        float a = 0.5, s = 0.0;
        for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + 17.0; a *= 0.5; }
        return s / 0.9375;
      }
      vec2 imgUv(vec2 uv) { return (uv - 0.5) * uCover + 0.5; }
      vec2 asp(vec2 uv) { return vec2(uv.x * uRes.x / uRes.y, uv.y); }

      // 연필이 지그재그로 왕복하며 왼쪽 위에서 오른쪽 아래로 훑고 지나가는 순서
      float sketchMask(vec2 uv) {
        const float BANDS = 6.0;
        vec2 d = vec2(0.82, 0.57);               // 연필 선 방향
        vec2 n = vec2(0.57, -0.82);              // 띠가 넘어가는 방향
        vec2 c = uv - 0.5;
        float along = dot(c, d);
        float acrossRaw = dot(c, n);
        float across = acrossRaw * 0.72 + 0.5 + (noise(asp(uv) * 5.0 + uSeed) - 0.5) * 0.06
                     + (noise(asp(uv) * 45.0) - 0.5) * 0.025;
        float b = clamp(across, 0.0, 0.999) * BANDS;
        float bi = floor(b);
        float al = along * 0.72 + 0.5;
        if (mod(bi, 2.0) > 0.5) al = 1.0 - al;
        float field = (bi + al) / BANDS;
        // 선 한 가닥 한 가닥이 들쭉날쭉 나아가도록
        field += noise(vec2(acrossRaw * uRes.y * 0.3, along * 3.0) + uSeed) * 0.06;
        return smoothstep(0.0, 0.035, uDrawS * 1.14 - field);
      }

      // 물감이 번지듯 색이 퍼지는 순서
      float paintMask(vec2 uv) {
        float n = fbm(asp(uv) * 2.2 + uSeed * 3.1);
        float sweep = uv.x * 0.6 + (1.0 - uv.y) * 0.4;
        float field = sweep * 0.5 + n * 0.5;
        return smoothstep(0.0, 0.22, uDrawC * 1.25 - field);
      }

      // 바람에 날려 가는 순서: 오른쪽부터 흩어진다. 0 이하면 아직 붙어 있고 1이면 다 날아감
      float blowAge(vec2 uv, float e) {
        float n = fbm(asp(uv) * 3.0 + uSeed * 7.0);
        float field = (1.0 - uv.x) * 0.6 + n * 0.4;
        return (e * (1.0 + LIFE) - field) / LIFE;
      }
    `;

    const QUAD_VS = `
      attribute vec2 aPos;
      uniform vec2 uCenter;
      uniform vec2 uHalf;
      varying vec2 vUv;
      void main() {
        vUv = aPos * 0.5 + 0.5;
        gl_Position = vec4(uCenter + aPos * uHalf, 0.0, 1.0);
      }
    `;

    const QUAD_FS = COMMON + `
      uniform float uDpr;
      uniform float uRadius;  // 모서리 둥글기 (CSS px)
      varying vec2 vUv;
      void main() {
        vec2 iuv = imgUv(vUv);
        vec3 photo = texture2D(uColorTex, iuv).rgb;
        float sk = texture2D(uSketchTex, iuv).r;
        float lum = dot(photo, vec3(0.299, 0.587, 0.114));
        vec2 px = vUv * uRes;

        // 종이
        float grain = noise(px * 1.3) * 0.5 + noise(px * 0.35) * 0.5;
        vec3 paper = vec3(0.965, 0.95, 0.915) - (grain - 0.5) * 0.05;
        paper *= 1.0 - 0.1 * pow(length(vUv - 0.5) * 1.3, 3.0);

        // 연필 스케치: 윤곽선 + 어두운 곳의 빗금
        float wob = noise(px * 0.04) * 5.0;
        float h1 = smoothstep(0.5, 0.95, sin((px.x + px.y) * 0.8 + wob) * 0.5 + 0.5);
        float h2 = smoothstep(0.5, 0.95, sin((px.x - px.y * 1.3) * 0.7 - wob) * 0.5 + 0.5);
        float dark = 1.0 - sk;
        dark = max(dark, h1 * smoothstep(0.6, 0.2, lum) * 0.42);
        dark = max(dark, h2 * smoothstep(0.32, 0.05, lum) * 0.42);
        dark *= 0.75 + 0.5 * grain;

        float goneS = smoothstep(0.0, 0.06, blowAge(vUv, uEraseS)) * step(0.0001, uEraseS);
        float sA = sketchMask(vUv) * (1.0 - goneS);
        vec3 col = mix(paper, PENCIL, clamp(dark, 0.0, 1.0) * 0.82 * sA);

        // 채색: 연필 위에 옅은 물감이 먼저 번지고, 이어서 원래 사진 색으로 차오른다
        float goneC = smoothstep(0.0, 0.06, blowAge(vUv, uEraseC)) * step(0.0001, uEraseC);
        float c = paintMask(vUv) * (1.0 - goneC);
        float wash = smoothstep(0.0, 0.5, c);
        float solid = smoothstep(0.35, 1.0, c);
        float wetEdge = smoothstep(0.0, 0.15, c) * (1.0 - smoothstep(0.15, 0.45, c));
        vec3 washCol = col * mix(vec3(1.0), photo * 1.1 + 0.12, 0.85) * (1.0 - 0.1 * wetEdge);
        col = mix(col, washCol, wash);
        col = mix(col, photo, solid);

        // 둥근 모서리
        vec2 q = abs(vUv - 0.5) * uRes - (uRes * 0.5 - uRadius);
        float corner = length(max(q, 0.0)) - uRadius;
        float alpha = clamp(0.5 - corner * uDpr, 0.0, 1.0);
        gl_FragColor = vec4(col * alpha, alpha);
      }
    `;

    // 날아가는 가루
    const DUST_VS = COMMON + `
      attribute vec2 aHome;   // 원래 붙어 있던 자리 (0~1)
      attribute vec3 aRand;
      uniform float uMode;    // 0: 물감 가루, 1: 연필 가루
      uniform float uCell;    // 가루 크기 (기기 px)
      varying vec4 vCol;
      void main() {
        float e = mix(uEraseC, uEraseS, uMode);
        float age = blowAge(aHome, e);
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        gl_PointSize = 0.0;
        vCol = vec4(0.0);
        if (e <= 0.0 || age <= 0.0 || age >= 1.0) return;

        vec2 iuv = imgUv(aHome);
        vec3 photo = texture2D(uColorTex, iuv).rgb;
        float a;
        vec3 c;
        if (uMode < 0.5) {
          a = paintMask(aHome);
          c = photo;
        } else {
          float lum = dot(photo, vec3(0.299, 0.587, 0.114));
          float dark = max(1.0 - texture2D(uSketchTex, iuv).r, smoothstep(0.55, 0.1, lum) * 0.3);
          a = clamp(dark * 1.3, 0.0, 1.0) * sketchMask(aHome);
          c = PENCIL;
        }
        if (a < 0.03) return;

        // 바람: 오른쪽 위로, 갈수록 빨라지고 소용돌이친다
        float k = age * age * (0.5 + aRand.x);
        vec2 off = vec2(0.6, 0.17) * k * 1.4;
        off += vec2(sin(age * 7.0 + aRand.y * 6.283), cos(age * 6.0 + aRand.z * 6.283)) * 0.035 * age;
        off.y += (aRand.z - 0.5) * 0.3 * k;
        vec2 pos = aHome + vec2(off.x * uRes.y / uRes.x, off.y);

        gl_Position = vec4(uCenter + (pos * 2.0 - 1.0) * uHalf, 0.0, 1.0);
        gl_PointSize = uCell * mix(1.6, 0.5, age);
        vCol = vec4(c, a * pow(1.0 - age, 1.3));
      }
    `;

    const DUST_FS = `
      precision highp float;
      varying vec4 vCol;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float a = vCol.a * smoothstep(0.5, 0.28, d);
        gl_FragColor = vec4(vCol.rgb * a, a);
      }
    `;

    function program(vsSrc, fsSrc, attribs) {
      const p = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, vsSrc], [gl.FRAGMENT_SHADER, fsSrc]]) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        gl.attachShader(p, s);
      }
      attribs.forEach((name, i) => gl.bindAttribLocation(p, i, name));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      const u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const name = gl.getActiveUniform(p, i).name;
        u[name] = gl.getUniformLocation(p, name);
      }
      return { p, u };
    }

    let quad, dust;
    try {
      quad = program(QUAD_VS, QUAD_FS, ['aPos']);
      dust = program(DUST_VS, DUST_FS, ['aHome', 'aRand']);
    } catch (err) {
      giveUp(err);
      return;
    }

    const quadBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const dustBuf = gl.createBuffer();
    let dustCount = 0;

    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    function texture(source) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return t;
    }

    // ---------- 사진 → 연필 스케치 ----------
    function boxBlur(src, w, h, r) {
      const tmp = new Float32Array(src.length);
      const out = new Float32Array(src.length);
      const pass = (a, b, len, lines, step, stride) => {
        for (let l = 0; l < lines; l++) {
          const base = l * stride;
          let sum = 0;
          for (let i = -r; i <= r; i++) sum += a[base + Math.min(Math.max(i, 0), len - 1) * step];
          for (let i = 0; i < len; i++) {
            b[base + i * step] = sum / (2 * r + 1);
            sum += a[base + Math.min(i + r + 1, len - 1) * step] - a[base + Math.max(i - r, 0) * step];
          }
        }
      };
      pass(src, tmp, w, h, 1, w);   // 가로
      pass(tmp, out, h, w, w, 1);   // 세로
      return out;
    }

    function makeSketch(img) {
      // 선이 너무 굵어지지 않게 원본보다 크게 키워서 계산한다
      const scale = Math.min(2, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h);
      const px = data.data;

      let gray = new Float32Array(w * h);
      for (let i = 0; i < gray.length; i++) {
        gray[i] = (px[i * 4] * 0.299 + px[i * 4 + 1] * 0.587 + px[i * 4 + 2] * 0.114) / 255;
      }
      gray = boxBlur(gray, w, h, 1);            // JPEG 잡티 정리
      const r = Math.max(2, Math.round(w / 170));
      const soft = boxBlur(boxBlur(gray, w, h, r), w, h, r);

      // 주변보다 어두운 곳만 선으로 남긴다 (컬러 닷지 방식)
      for (let i = 0; i < gray.length; i++) {
        const line = clamp01((1 - gray[i] / Math.max(soft[i], 0.02) - 0.035) * 4.5);
        const v = Math.round((1 - Math.pow(line, 0.8)) * 255);
        px[i * 4] = px[i * 4 + 1] = px[i * 4 + 2] = v;
        px[i * 4 + 3] = 255;
      }
      ctx.putImageData(data, 0, 0);
      return c;
    }

    // ---------- 화면 크기 ----------
    let viewW = 0, viewH = 0, cssW = 0, cssH = 0, cardX = 0, cardY = 0, radius = 0, dpr = 1, dirty = true;
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const d = Math.min(devicePixelRatio || 1, 2);
      const box = frameEl.getBoundingClientRect();
      if (!w || !h || !box.width) return;
      if (w === viewW && h === viewH && d === dpr && box.width === cssW && box.height === cssH) return;
      viewW = w; viewH = h; dpr = d;
      cssW = box.width; cssH = box.height;            // 종이 크기
      cardX = box.left + box.width / 2;               // 종이 중심
      cardY = box.top + box.height / 2;
      radius = parseFloat(getComputedStyle(frameEl).borderTopLeftRadius) || 0;
      canvas.width = Math.round(w * d);
      canvas.height = Math.round(h * d);
      gl.viewport(0, 0, canvas.width, canvas.height);

      // 가루 격자
      const cols = Math.ceil(cssW / CELL), rows = Math.ceil(cssH / CELL);
      const arr = new Float32Array(cols * rows * 5);
      let k = 0;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          arr[k++] = (x + 0.5) / cols;
          arr[k++] = (y + 0.5) / rows;
          arr[k++] = Math.random();
          arr[k++] = Math.random();
          arr[k++] = Math.random();
        }
      }
      dustCount = cols * rows;
      gl.bindBuffer(gl.ARRAY_BUFFER, dustBuf);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
      dirty = true;
    }
    addEventListener('resize', () => { resize(); readScroll(); });

    // ---------- 상태 ----------
    let photos = [];          // { color, sketch, aspect }
    let shown = 0;
    let phase = 'draw';       // 'draw' | 'idle' | 'erase'
    let tDraw = 0, tErase = 0;
    let seed = Math.random() * 10;
    const s = { drawS: 0, drawC: 0, eraseC: 0, eraseS: 0 };

    function update(dt) {
      if (reduceMotion) {
        // 움직임 줄이기 설정에서는 짧은 페이드로만 전환
        if (shown !== target || phase !== 'idle') {
          shown = target;
          setBg(shown);
          phase = 'idle';
          s.drawS = s.drawC = 1; s.eraseC = s.eraseS = 0;
          canvas.classList.remove('fade');
          void canvas.offsetWidth;
          canvas.classList.add('fade');
          dirty = true;
        }
        return;
      }

      if (phase !== 'erase' && target !== shown) {
        phase = 'erase';
        tErase = 0;
      }

      if (phase === 'erase') {
        // 채색이 먼저 날아가고, 뒤따라 스케치가 날아간다
        tErase += dt / ERASE_MS;
        s.eraseC = clamp01(tErase / 0.6);
        s.eraseS = clamp01((tErase - 0.4) / 0.6);
        if (tErase >= 1) {
          shown = target;
          setBg(shown);
          seed = Math.random() * 10;
          s.drawS = s.drawC = s.eraseC = s.eraseS = 0;
          tDraw = 0;
          phase = 'draw';
        }
        dirty = true;
      } else if (phase === 'draw') {
        // 스케치가 먼저 그려지고, 이어서 색이 입혀진다
        tDraw += dt / DRAW_MS;
        s.drawS = clamp01(tDraw / 0.55);
        s.drawC = easeInOut(clamp01((tDraw - 0.45) / 0.55));
        if (tDraw >= 1) phase = 'idle';
        dirty = true;
      }
    }

    function setCommon(prog) {
      const u = prog.u, ph = photos[shown];
      const a = cssW / cssH;
      gl.useProgram(prog.p);
      gl.uniform2f(u.uRes, cssW, cssH);
      gl.uniform2f(u.uCenter, cardX / viewW * 2 - 1, 1 - cardY / viewH * 2);
      gl.uniform2f(u.uHalf, cssW / viewW, cssH / viewH);
      gl.uniform2f(u.uCover, a > ph.aspect ? 1 : a / ph.aspect, a > ph.aspect ? ph.aspect / a : 1);
      gl.uniform1f(u.uDrawS, s.drawS);
      gl.uniform1f(u.uDrawC, s.drawC);
      gl.uniform1f(u.uEraseC, s.eraseC);
      gl.uniform1f(u.uEraseS, s.eraseS);
      gl.uniform1f(u.uSeed, seed);
      gl.uniform1i(u.uColorTex, 0);
      gl.uniform1i(u.uSketchTex, 1);
    }

    function render() {
      const ph = photos[shown];
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, ph.color);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, ph.sketch);

      // 종이 + 스케치 + 채색
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      setCommon(quad);
      gl.uniform1f(quad.u.uDpr, dpr);
      gl.uniform1f(quad.u.uRadius, radius);
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.enableVertexAttribArray(0);
      gl.disableVertexAttribArray(1);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // 날아가는 가루
      if (s.eraseC > 0 || s.eraseS > 0) {
        setCommon(dust);
        gl.uniform1f(dust.u.uCell, CELL * dpr);
        gl.bindBuffer(gl.ARRAY_BUFFER, dustBuf);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 20, 0);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 20, 8);
        if (s.eraseS > 0 && s.eraseS < 1) {
          gl.uniform1f(dust.u.uMode, 1);
          gl.drawArrays(gl.POINTS, 0, dustCount);
        }
        if (s.eraseC > 0 && s.eraseC < 1) {
          gl.uniform1f(dust.u.uMode, 0);
          gl.drawArrays(gl.POINTS, 0, dustCount);
        }
      }
    }

    let last = 0;
    function frame(now) {
      const dt = Math.min(now - last, 50);
      last = now;
      update(dt);
      if (dirty) {
        dirty = false;
        render();
      }
      requestAnimationFrame(frame);
    }

    // ---------- 시작 ----------
    Promise.all(imgs.map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve()))
      .then(() => {
        photos = imgs.map(img => ({
          color: texture(img),
          sketch: texture(makeSketch(img)),
          aspect: img.naturalWidth / img.naturalHeight,
        }));
        resize();
        readScroll();
        shown = target;
        setBg(shown);
        last = performance.now();
        requestAnimationFrame(frame);
      })
      .catch(err => {
        // file:// 로 직접 열면 브라우저가 사진 픽셀 읽기를 막아서 여기로 온다
        giveUp(err);
      });
  })();
  </script>
</body>
</html>
