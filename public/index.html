<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    html, body {
      margin: 0;
      background: #0b0b10;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    /* 스크롤 길이: 사진 1장당 100vh */
    .scroller {
      height: 400vh;
    }
    .stage {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
    }

    /* 배경: 현재 사진을 흐리게 깔아서 분위기 연출 */
    .bg {
      position: absolute;
      inset: -10%;
      background-size: cover;
      background-position: center;
      filter: blur(60px) saturate(1.4) brightness(0.55);
      opacity: 0;
      will-change: opacity;
    }

    /* 마우스에 따라 기울어지는 3D 공간 */
    .world {
      position: relative;
      width: min(70vw, 65vh);
      aspect-ratio: 1 / 1;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      overflow: hidden;
      backface-visibility: hidden;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      will-change: transform, opacity, filter;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 빛 반사 하이라이트 */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at var(--gx, 50%) var(--gy, 30%),
        rgba(255, 255, 255, 0.35),
        rgba(255, 255, 255, 0) 55%
      );
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    /* 바닥 그림자 */
    .floor-shadow {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -14%;
      height: 12%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.6), transparent 70%);
      filter: blur(10px);
      transform: translateZ(-200px);
    }

    .dots {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: background 0.3s, transform 0.3s;
    }
    .dots span.active {
      background: #fff;
      transform: scale(1.5);
    }
  </style>
</head>
<body>
  <div class="scroller">
    <div class="stage">
      <div class="bgs"></div>
      <div class="world">
        <div class="floor-shadow"></div>
        <div class="card"><img src="see.jpeg" alt="사진 1"></div>
        <div class="card"><img src="mad.jpeg" alt="사진 2"></div>
        <div class="card"><img src="cry.jpeg" alt="사진 3"></div>
        <div class="card"><img src="fu.jpeg" alt="사진 4"></div>
      </div>
    </div>
  </div>
  <div class="dots" aria-hidden="true"></div>

  <script>
    const scroller = document.querySelector('.scroller');
    const world = document.querySelector('.world');
    const cards = [...document.querySelectorAll('.card')];
    const bgBox = document.querySelector('.bgs');
    const dotsBox = document.querySelector('.dots');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 배경 레이어와 인디케이터 생성
    const bgs = cards.map(card => {
      const el = document.createElement('div');
      el.className = 'bg';
      el.style.backgroundImage = `url(${card.querySelector('img').getAttribute('src')})`;
      return bgBox.appendChild(el);
    });
    const dots = cards.map(() => dotsBox.appendChild(document.createElement('span')));

    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

    // 목표값(target)과 부드럽게 따라가는 현재값(current)
    let targetPos = 0, pos = 0;
    let targetTiltX = 0, targetTiltY = 0, tiltX = 0, tiltY = 0;

    function readScroll() {
      const max = scroller.offsetHeight - innerHeight;
      const ratio = max > 0 ? clamp(scrollY / max, 0, 1) : 0;
      targetPos = ratio * (cards.length - 1);
    }

    // 마우스 / 터치 위치에 따라 3D 기울기
    function onPointer(x, y) {
      if (reduceMotion) return;
      const nx = x / innerWidth - 0.5;   // -0.5 ~ 0.5
      const ny = y / innerHeight - 0.5;
      targetTiltY = nx * 24;              // 좌우 회전 (deg)
      targetTiltX = -ny * 18;             // 상하 회전 (deg)
    }
    addEventListener('pointermove', e => onPointer(e.clientX, e.clientY), { passive: true });
    document.addEventListener('pointerleave', () => { targetTiltX = 0; targetTiltY = 0; });

    function cardTransform(d) {
      // d = 카드 번호 - 현재 위치
      // d > 0 : 뒤에 쌓여 대기 중인 카드
      // d < 0 : 위로 뒤집히며 날아가는 카드
      if (reduceMotion) {
        return { transform: 'none', opacity: clamp(1 - Math.abs(d), 0, 1), bright: 1 };
      }
      if (d >= 0) {
        const t = Math.min(d, 3);
        return {
          transform: `
            translate3d(0, ${-t * 16}%, ${-t * 220}px)
            rotateX(${t * 8}deg)
            scale(${1 - t * 0.04})`,
          opacity: clamp(1 - t * 0.28, 0, 1),
          bright: 1 - t * 0.3
        };
      }
      const t = Math.min(-d, 1.5);
      return {
        transform: `
          translate3d(0, ${t * 115}%, ${t * 260}px)
          rotateX(${-t * 75}deg)
          rotateZ(${t * 6}deg)`,
        opacity: clamp(1 - t * 1.1, 0, 1),
        bright: 1 + t * 0.2
      };
    }

    function frame() {
      // 관성 있게 따라가기
      const ease = reduceMotion ? 1 : 0.1;
      pos = lerp(pos, targetPos, ease);
      tiltX = lerp(tiltX, targetTiltX, 0.08);
      tiltY = lerp(tiltY, targetTiltY, 0.08);

      // 카드가 넘어가는 중간에 공간 전체가 살짝 흔들리듯 회전
      const between = pos - Math.floor(pos);
      const swing = reduceMotion ? 0 : Math.sin(between * Math.PI) * 6;

      world.style.transform =
        `rotateX(${tiltX + swing}deg) rotateY(${tiltY}deg)`;

      // 하이라이트 위치
      const gx = 50 + tiltY * 2;
      const gy = 30 - tiltX * 2;

      cards.forEach((card, i) => {
        const d = i - pos;
        const { transform, opacity, bright } = cardTransform(d);
        card.style.transform = transform;
        card.style.opacity = opacity;
        card.style.filter = `brightness(${bright})`;
        card.style.zIndex = String(100 - Math.round(Math.abs(d) * 10));
        card.style.visibility = opacity <= 0.001 ? 'hidden' : 'visible';
        card.style.setProperty('--gx', gx + '%');
        card.style.setProperty('--gy', gy + '%');

        bgs[i].style.opacity = clamp(1 - Math.abs(d), 0, 1);
      });

      const current = Math.round(pos);
      dots.forEach((dot, i) => dot.classList.toggle('active', i === current));

      requestAnimationFrame(frame);
    }

    addEventListener('scroll', readScroll, { passive: true });
    addEventListener('resize', readScroll);
    readScroll();
    pos = targetPos;
    requestAnimationFrame(frame);
  </script>
</body>
</html>
